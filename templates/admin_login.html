<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login – TrucksDeal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--orange-dark:#ea580c;--dark:#0f172a;--mid:#475569;--border:#e2e8f0;--light:#f8fafc;--white:#ffffff;--radius:12px;--radius-sm:6px;--shadow-lg:0 12px 48px rgba(0,0,0,.14)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.brand-trucks{color:var(--dark);font-weight:800}
.brand-deal{color:var(--orange);font-weight:800}
.card{background:var(--white);border-radius:var(--radius);padding:2.5rem;width:100%;max-width:400px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.logo{text-align:center;font-size:1.8rem;font-weight:800;margin-bottom:1.5rem}
h2{text-align:center;margin-bottom:1.5rem;font-size:1.3rem;color:var(--dark)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:var(--mid)}
.form-group input{width:100%;padding:.65rem .9rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;outline:none;transition:border .2s}
.form-group input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{padding-right:2.75rem;flex:1}
.pw-toggle{position:absolute;right:0;top:0;bottom:0;width:2.5rem;background:none;border:none;cursor:pointer;font-size:1rem;color:var(--mid)}
.btn{display:block;width:100%;padding:.75rem;border-radius:var(--radius-sm);background:var(--orange);color:var(--white);border:none;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:.5rem}
.btn:hover{background:var(--orange-dark)}
.flash{padding:.75rem 1rem;border-radius:var(--radius-sm);margin-bottom:1rem;font-size:.88rem;font-weight:500}
.flash-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.back{display:block;text-align:center;margin-top:1.25rem;font-size:.85rem;color:var(--mid)}
.back:hover{color:var(--orange)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="brand-trucks">Trucks</span><span class="brand-deal">Deal</span></div>
  <h2>Admin Login</h2>
  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
  <div class="flash flash-{{cat}}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}
  <form method="post">
    <div class="form-group">
      <label>Username</label>
      <input name="username" required autofocus placeholder="admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="pw-wrap">
        <input name="password" id="loginPw" type="password" required placeholder="••••••••">
        <button type="button" class="pw-toggle" onclick="const e=document.getElementById('loginPw');e.type=e.type==='password'?'text':'password';this.textContent=e.type==='password'?'👁':'🙈'">👁</button>
      </div>
    </div>
    <button class="btn" type="submit">Sign In</button>
  </form>
  <a href="{{ url_for('index') }}" class="back">← Back to Site</a>
</div>
</body>
</html>
